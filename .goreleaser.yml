version: 2

project_name: thrive

before:
  hooks:
    - go mod tidy

builds:
  - id: thrive-linux
    binary: thrive
    main: ./cmd/thrive
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.ShortCommit}}

  - id: thrived-linux
    binary: thrived
    main: ./cmd/thrived
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0

  - id: thrive-darwin
    binary: thrive
    main: ./cmd/thrive
    goos: [darwin]
    goarch: [arm64, amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.ShortCommit}}

  - id: thrive-windows
    binary: thrive
    main: ./cmd/thrive
    goos: [windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.ShortCommit}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: thakurtpr
    name: thrive
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
