name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.sum
        run: go mod verify

      - name: Vet
        run: GOOS=linux go vet ./...

      - name: Build (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build ./...

      - name: Build (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go build ./...

      - name: Run tests
        run: GOOS=linux go test -v -count=1 ./...

      - name: Run tests with race detector
        run: GOOS=linux go test -race -count=1 ./...

      - name: Test coverage
        run: |
          GOOS=linux go test -coverprofile=coverage.txt -covermode=atomic ./...
          go tool cover -func=coverage.txt

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.txt
          fail_ci_if_error: false

  build-darwin:
    name: Build (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build CLI (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 go build ./cmd/thrive

      - name: Run non-linux tests
        run: go test -v -count=1 ./cmd/thrive/...

  build-windows:
    name: Build (Windows)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build CLI (windows/amd64)
        run: GOOS=windows GOARCH=amd64 go build ./cmd/thrive

  e2e:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Run on main branch pushes and non-draft PRs; skip drafts to save time.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run E2E tests
        run: bash scripts/e2e-docker.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: GOOS=linux go vet ./...

      - name: golangci-lint
        # golangci-lint stable releases are built with Go 1.24 and will not run
        # against a go.mod that requires Go 1.25 (pre-release). Enable once
        # golangci-lint ships a release built with Go ≥ 1.25.
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --go 1.25 --build-tags linux --timeout 5m
