name: Build VM Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v0.1.3)'
        required: true
        default: 'v0.1.3'

permissions:
  contents: write

jobs:
  build-vm-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install linuxkit
        run: go install github.com/linuxkit/linuxkit/src/cmd/linuxkit@latest

      - name: Build Linux daemon binaries
        run: make build-linux

      - name: Build VM image
        run: bash scripts/build-vm-image.sh arm64

      - name: Upload to GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          # The Release (goreleaser) workflow runs concurrently on tag push
          # and may not have created the release yet — wait for it instead
          # of failing with "release not found".
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for release $TAG to exist (attempt $i/60)..."
            sleep 30
          done
          gh release view "$TAG" >/dev/null 2>&1 || {
            echo "Release $TAG still missing after 30 minutes" >&2
            exit 1
          }
          gh release upload "$TAG" thrive-vm-darwin-arm64.tar.gz --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: thrive-vm-darwin-arm64
          path: thrive-vm-darwin-arm64.tar.gz
